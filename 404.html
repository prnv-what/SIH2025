<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="refresh" content="0; url=/SIH2025/" />
    <script>
      // Single Page App redirect for GitHub Pages
      const redirect = () => {
        const segment = '/SIH2025';
        const path = window.location.pathname.replace(segment, '');
        const search = window.location.search;
        const hash = window.location.hash;
        window.location.replace(segment + '/' + (path.startsWith('/') ? path.slice(1) : path) + search + hash);
      };
      redirect();
    </script>
  </head>
  <body></body>
  </html>
